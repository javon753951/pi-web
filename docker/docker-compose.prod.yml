# ============================================================
# 服务器侧生产编排：与 docker/docker-compose.yml（本地开发）的区别
#
#   1. 用 image: 拉取 GHCR 镜像，而不是 build: 本地构建 ——
#      服务器上不需要源码，部署 = pull + up -d
#   2. 版本由环境变量 PI_WEB_IMAGE_TAG 控制：
#      发布时 CI 会 export PI_WEB_IMAGE_TAG=v0.1.0 再执行命令；
#      服务器手动回滚时也用同样方式指回旧 tag（见教程「回滚」一节）
#   3. 去掉了本地 compose 里 Windows 专用的 ppt-express 目录挂载
#
# 用法（服务器 ~/pi-web 目录下）：
#   PI_WEB_IMAGE_TAG=v0.1.0 docker compose -f docker-compose.prod.yml up -d
# ============================================================
services:
  pi-web:
    image: ghcr.io/javon753951/pi-web:${PI_WEB_IMAGE_TAG:-latest}
    container_name: pi-web
    ports:
      - "${PI_WEB_PORT:-8787}:8787"
    environment:
      # 建议在 ~/pi-web/.env 里固定 PI_WEB_TOKEN（与手机端保存的链接一致）；
      # 不设置则容器首次启动自动生成，落盘到挂载的 data/.token，进容器查看
      - PI_WEB_TOKEN=${PI_WEB_TOKEN:-}
      - PI_WEB_HOST=0.0.0.0
    volumes:
      # 元数据/会话/工作区/MCP 配置 —— 镜像可以随时换，数据必须留在宿主机
      - ./data:/app/data
      # pi 用户级配置（auth.json/settings.json/已装扩展）—— 独立卷持久化，
      # 重新部署不丢；首次部署后需进容器完成 pi 登录（教程 4.1 步骤 6）
      - pi-agent:/root/.pi/agent
    restart: unless-stopped

volumes:
  pi-agent:
